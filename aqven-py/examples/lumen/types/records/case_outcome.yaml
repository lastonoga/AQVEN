apiVersion: "aqven/v1"
kind: "Type"
type: "record"
description: "Итог обработки обращения покупателя"
fields:
- name: "case_ref"
  type: "Text"
  description: "Номер обращения"
  maxLength: 31
  pattern: "^CASE-[0-9A-HJKMNP-TV-Z]{26}$"
- name: "status"
  type: "CaseStatus"
  description: "Итог обращения"
- name: "intent"
  type: "CaseIntent"
  description: "Намерение обращения"
- name: "tier"
  type: "CascadeTier"
  description: "Ступень каскада, на которой определено намерение"
- name: "record"
  type: "CaseRecord"
  description: "Анкета обращения"
- name: "resolution"
  type: "Resolution"
  description: "Решение по обращению"
- name: "reply"
  type: "ReplyDraft?"
  description: "Отправленный ответ; null, если ответ отклонён"
- name: "media"
  type: "ReplyMedia"
  description: "Медиа, приложенные к ответу"
- name: "closed_at"
  type: "DateTime"
  description: "Время закрытия обращения"

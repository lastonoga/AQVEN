[project]
name = "showcase-host"
version = "0.0.0"
description = "Хост-приложение, которое использует модуль воркфлоу lumen в процессе, по HTTP и по MCP"
requires-python = ">=3.14,<3.15"
dependencies = ["aqven", "lumen"]

[tool.uv.sources]
aqven = { workspace = true }
lumen = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "app"

[tool.pytest.ini_options]
testpaths = ["tests"]
aqven_project = "lumen/src/lumen"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"lumen/src/lumen/types.py" = ["E501"]

[tool.ruff.format]
exclude = ["lumen/src/lumen/types.py"]

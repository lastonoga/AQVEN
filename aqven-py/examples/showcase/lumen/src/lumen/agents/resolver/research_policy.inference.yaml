apiVersion: "aqven/v1"
kind: "Inference"
description: "Исследование политики магазина и прецедентов хелпдеска по вопросу основного агента"
in:
- name: "question"
  type: "Text"
  description: "Вопрос основного агента о политике магазина"
  maxLength: 500
- name: "category"
  type: "ProductCategory"
  description: "Категория товара, к которой относится вопрос"
out:
- name: "answer"
  type: "Text"
  description: "Краткий ответ на вопрос по найденным правилам и прецедентам"
  maxLength: 800
- name: "sources"
  type: "Text[]"
  description: "Обращения и макросы хелпдеска, на которые опирается ответ"
  maxLength: 120
  maxItems: 5

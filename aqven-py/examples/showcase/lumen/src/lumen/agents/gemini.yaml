apiVersion: "aqven/v1"
kind: "Agent"
description: "Мультимодальный разбор обращения, анкета по вложениям и черновик ответа семейства Google"
model: "openrouter:google/gemini-2.5-flash-lite"
settings:
  temperature: 0.2
  max_tokens: 4000
output:
  strict: false
  retries: 2
capabilities:
  input:
  - "text"
  - "image"
  - "audio"
  - "video"
  - "document"

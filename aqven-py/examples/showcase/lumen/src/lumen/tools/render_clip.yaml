apiVersion: "aqven/v1"
kind: "Tool"
description: "Короткий ролик по картинке-инструкции: долгая задача генерации видео в Together"
run: "@root.tools.functions:start_clip"
effect: "external"
idempotency_key:
- "image"
- "text"
- "seconds"
secrets:
- name: "together_api_key"
  ref: "ref:env/TOGETHER_API_KEY"
wait:
  poll: "@root.tools.functions:poll_clip"
  interval_seconds: 20
  timeout_seconds: 1800
in:
- name: "image"
  type: "Image"
  description: "Картинка-инструкция — первый кадр ролика"
- name: "text"
  type: "Text"
  description: "Текст ответа — сценарий ролика"
  maxLength: 1500
- name: "seconds"
  type: "Int"
  description: "Длительность ролика в секундах"
  minimum: 4
  maximum: 8
out:
- name: "clip"
  type: "Video"
  description: "Готовый ролик в MP4"

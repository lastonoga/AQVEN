apiVersion: "aqven/v1"
kind: "Tool"
description: "Заказ Lumen по номеру: даты покупки и доставки, сумма и состав"
run: "@root.tools.functions:lookup_order"
effect: "read"
secrets:
- name: "orders_token"
  ref: "ref:env/LUMEN_ORDERS_TOKEN"
in:
- name: "order_id"
  type: "OrderId"
  description: "Номер заказа"
out:
- name: "order_id"
  type: "OrderId"
  description: "Номер заказа"
- name: "placed_on"
  type: "Date"
  description: "Дата оформления заказа"
- name: "delivered_on"
  type: "Date?"
  description: "Дата доставки; null, если заказ ещё не доставлен"
- name: "total"
  type: "Money"
  description: "Сумма заказа"
- name: "items"
  type: "ProductRef[]"
  description: "Товары заказа"
  maxItems: 20

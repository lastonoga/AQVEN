apiVersion: "aqven/v1"
kind: "Eval"
description: "Качество ответа покупателю: оценка критика, те же проверки цитат и обещаний, что при исполнении, и стоимость; гейт релиза и оптимизация промта и вариантов GEPA"
inference: "revise"
agent: "gpt"
dataset: "reply_cases"
scorers:
- id: "critique"
  kind: "continuous"
  inference: "critique"
  agent: "deepseek"
- id: "citations"
  kind: "binary"
  use: "citations_in_sources"
  with:
    citations: "$out.reply.citations"
    sources: "$in.chunks"
    id: "chunk_id"
    quote: "quote"
    text: "text"
- id: "promises"
  kind: "binary"
  run: "@root.code.support_case:promises_match_resolution"
- id: "cost_usd"
  kind: "continuous"
  use: "cost_usd"
gate:
  baseline: "production"
  repeats: 3
  min_dataset: 200
  min_discordant: 25
  families:
    primary:
    - "critique"
    safety:
    - "citations"
    - "promises"
    - "cost_usd"
  alpha_primary: 0.05
  q_secondary: 0.1
  alpha_safety: 0.05
  ni_margin: 0.02
  bootstrap:
    method: "BCa"
    resamples: 10000
    seed: 20260917
  max_dropped_ratio: 0.05
  actions:
    pass: "release"
    warn: "require_approval"
    block: "reject"
    gate_unavailable: "reject"
optimization:
  engine: "gepa"
  objective: "critique"
  train_split: "train"
  dev_split: "dev"
  reflection_agent: "mistral"
  max_metric_calls: 400
  max_repairs: 1
  stop_score: 0.92
  limits:
    usd_micros: 5000000

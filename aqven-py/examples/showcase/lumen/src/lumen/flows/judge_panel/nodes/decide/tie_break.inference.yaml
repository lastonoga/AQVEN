apiVersion: "aqven/v1"
kind: "Inference"
description: "Слепая оценка кандидатов ответа покупателю по рубрике и выбор лучшего; при вердиктах панели — решение спора"
in:
- name: "summary"
  type: "Text"
  description: "Краткое содержание обращения после разбора"
  maxLength: 600
- name: "candidates"
  type: "ReplyDraft[]"
  description: "Кандидаты ответа без указания автора, по порядку номеров с нуля"
  maxItems: 3
- name: "chunks"
  type: "KbChunk[]"
  description: "Фрагменты базы знаний, на которые должны опираться кандидаты"
  maxItems: 80
- name: "panel"
  type: "JudgeVerdict[]?"
  description: "Разошедшиеся вердикты судей панели; null — оценка без спора"
  maxItems: 3
out:
- name: "rationale"
  type: "Text"
  description: "Обоснование по критериям рубрики, записывается до баллов"
  maxLength: 600
- name: "scores"
  type: "CriterionScore[]"
  description: "Баллы лучшего кандидата, по одному на критерий рубрики"
  maxItems: 3
- name: "best_index"
  type: "Int"
  description: "Номер лучшего кандидата в списке, считая с нуля"
  minimum: 0
  maximum: 2

apiVersion: "aqven/v1"
kind: "Inference"
description: "Критика ответа покупателю: опора на фрагменты базы знаний, согласие с решением и полнота; оценка и блокирующие замечания"
in:
- name: "summary"
  type: "Text"
  description: "Краткое содержание обращения после разбора"
  maxLength: 600
- name: "resolution"
  type: "Resolution"
  description: "Принятое решение, с которым ответ должен совпадать"
- name: "chunks"
  type: "KbChunk[]"
  description: "Фрагменты базы знаний, на которые должен опираться ответ"
  maxItems: 80
- name: "reply"
  type: "ReplyDraft"
  description: "Ответ на проверку с цитатами"
out:
- name: "rationale"
  type: "Text"
  description: "Обоснование оценки, написанное до балла"
  maxLength: 600
- name: "score"
  type: "Score"
  description: "Итоговая оценка ответа: опора на базу знаний, согласие с решением, полнота"
- name: "blocking"
  type: "Text[]"
  description: "Блокирующие замечания, без исправления которых ответ нельзя отправлять"
  maxLength: 200
  maxItems: 5
checks:
- run: "critique_consistent"
  on_fail: "flag"

apiVersion: "aqven/v1"
kind: "Inference"
description: "Анкета обращения по форме из данных: значения берутся из текста, краткого содержания и вложений, замечания проверки исправляются"
in:
- name: "message"
  type: "Text"
  description: "Текст обращения покупателя после нормализации пробелов"
  maxLength: 4000
- name: "summary"
  type: "Text"
  description: "Краткое содержание обращения после разбора"
  maxLength: 600
- name: "form_fields"
  type: "FieldSpec[]"
  description: "Поля анкеты для намерения обращения"
  maxItems: 30
- name: "feedback"
  type: "Issue[]?"
  description: "Замечания проверки прошлой попытки; null — попытка первая"
  maxItems: 10
- name: "photo"
  type: "Image?"
  description: "Фото товара или дефекта; null, если фото не приложено"
- name: "invoice"
  type: "Document?"
  description: "Счёт или чек покупки; null, если документ не приложен"
out:
- name: "record"
  type: "Dynamic"
  description: "Заполненная анкета обращения по форме из входа"
  schema_from: "$in.form_fields"
  limits:
    max_fields: 30
    max_depth: 2
    max_text_length: 400
    max_items: 10

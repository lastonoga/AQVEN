apiVersion: "aqven/v1"
kind: "Node"
node: "code"
description: "Сводит голоса: согласие только при единогласии голосов с достаточной уверенностью, иначе расхождение и намерение самого уверенного голоса"
run: "tally"
in:
- name: "ballots"
  type: "IntentBallot[]"
  description: "Голоса за намерение"
  maxItems: 3
  from: "$vote.out.ballots"
out:
- name: "intent"
  type: "CaseIntent"
  description: "Намерение большинства или самого уверенного голоса"
- name: "agreement"
  type: "Agreement"
  description: "Согласны ли голоса между собой"
- name: "confidence"
  type: "Score"
  description: "Уверенность в намерении"

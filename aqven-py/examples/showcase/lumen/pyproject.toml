[project]
name = "lumen"
version = "0.0.0"
description = "Lumen: воркфлоу поддержки покупателей и медиастудии бренда умного освещения на aqven"
requires-python = ">=3.14,<3.15"
dependencies = ["aqven"]

[tool.uv.sources]
aqven = { path = "../../../packages/aqven", editable = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-exclude = [".aqven", ".env"]
wheel-exclude = [".aqven", ".env"]

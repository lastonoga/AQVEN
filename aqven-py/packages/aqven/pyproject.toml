[project]
name = "aqven"
version = "0.0.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aqven-llm",
    "pydantic==2.13.5",
    "ruamel.yaml==0.19.1",
    "python-liquid==2.3.1",
    "httpx2==2.13.0",
    "pydantic-ai-slim[mcp]==2.43.0",
    "pydantic-evals==2.43.0",
    "dbos==2.31.1",
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
    "mcp==2.2.0",
    "rfc8785==0.1.4",
    "watchfiles==1.2.0",
    "genai-prices==0.1.7",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "claude-agent-sdk==0.2.154",
    "httpx==0.28.1",
    "tenacity==9.1.4",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
anthropic = ["aqven-llm[anthropic]"]
bedrock = ["aqven-llm[bedrock]"]
cohere = ["aqven-llm[cohere]"]
google = ["aqven-llm[google]"]
groq = ["aqven-llm[groq]"]
huggingface = ["aqven-llm[huggingface]"]
mistral = ["aqven-llm[mistral]"]
xai = ["aqven-llm[xai]"]

[project.scripts]
aqven = "aqven.cli:run"

[project.entry-points.pytest11]
aqven = "aqven.testing.plugin"

[tool.uv.sources]
aqven-llm = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

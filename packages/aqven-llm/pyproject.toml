[project]
name = "aqven-llm"
version = "0.0.0"
description = "Provider isolation for aqven: every model provider SDK import behind one factory."
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Kirill Burkhanov" }]
keywords = ["ai", "llm", "providers", "pydantic-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic==2.13.5",
    "httpx2==2.13.0",
    "pydantic-ai-slim[openrouter]==2.43.0",
    "openai==3.14.1",
    "tenacity==9.1.4",
]

[project.urls]
Homepage = "https://aqvenstudio.com"
Documentation = "https://aqvenstudio.com"
Repository = "https://github.com/lastonoga/AQVEN"
Issues = "https://github.com/lastonoga/AQVEN/issues"

[project.optional-dependencies]
anthropic = ["pydantic-ai-slim[anthropic]==2.43.0"]
bedrock = ["pydantic-ai-slim[bedrock]==2.43.0"]
cohere = ["pydantic-ai-slim[cohere]==2.43.0"]
google = ["pydantic-ai-slim[google]==2.43.0"]
groq = ["pydantic-ai-slim[groq]==2.43.0"]
huggingface = ["pydantic-ai-slim[huggingface]==2.43.0"]
mistral = ["pydantic-ai-slim[mistral]==2.43.0"]
xai = ["pydantic-ai-slim[xai]==2.43.0"]

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

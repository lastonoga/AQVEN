apiVersion: "aqven/v1"
kind: "Eval"
description: "Answer quality: the critic grade, a length check and the cost of the answer"
inference: "reply"
agent: "writer"
dataset: "reply_cases"
scorers:
- id: "filled"
  kind: "binary"
  use: "not_empty"
  with:
    field: "$out.answer"
- id: "brief"
  kind: "binary"
  run: "@root/code/scorers.py:answer_is_short"
- id: "grade"
  kind: "continuous"
  inference: "grade"
  agent: "critic"
- id: "cost_usd"
  kind: "continuous"
  use: "cost_usd"
gate:
  baseline: "production"
  repeats: 1
  min_dataset: 2
  min_discordant: 0
  families:
    primary:
    - "grade"
    safety:
    - "filled"
    - "cost_usd"
  alpha_primary: 0.05
  q_secondary: 0.1
  alpha_safety: 0.05
  ni_margin: 0.02
  bootstrap:
    method: "BCa"
    resamples: 1000
    seed: 20260918
  max_dropped_ratio: 0.5
  actions:
    pass: "release"
    warn: "require_approval"
    block: "reject"
    gate_unavailable: "reject"

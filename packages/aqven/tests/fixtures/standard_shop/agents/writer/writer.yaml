apiVersion: "aqven/v1"
kind: "Agent"
description: "Writes a reply to a note and checks it against similar ones"
model: "openai:gpt-5.4-mini"
instructions: "./writer.instructions.md"
tools:
- "stamp"
subagents:
- name: "lookup"
  description: "Searches for similar notes"
  agent: "critic"
  inference: "lookup"

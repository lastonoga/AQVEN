apiVersion: "aqven/v1"
kind: "Inference"
description: "Search for notes similar to the agent's question"
in:
- name: "question"
  type: "Text"
  description: "Agent's question"
  maxLength: 200
out:
- name: "similar"
  type: "Note[]"
  description: "Similar notes"
  maxItems: 3
- name: "score"
  type: "Score"
  description: "Similarity of the best note"

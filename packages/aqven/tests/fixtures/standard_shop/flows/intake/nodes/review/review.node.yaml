apiVersion: "aqven/v1"
kind: "Node"
node: "switch"
description: "Accepts a calm reply, rewrites a warm one"
on: "$reply.out.mood"
cases:
  calm:
    bind:
    - name: "text"
      from: "$reply.out.text"
  warm:
    node: "recheck"
    bind:
    - name: "text"
      from: "$recheck.out.text"
out:
- name: "text"
  type: "Text"
  description: "Accepted reply"
  maxLength: 200

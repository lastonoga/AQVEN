apiVersion: "aqven/v1"
kind: "Node"
node: "loop"
description: "Rewrites the reply and trims it until confidence reaches the threshold"
body:
- "redo"
- "trim"
max_iter: 2
stop:
- use: "threshold"
  with:
    path: "$iter.redo.out.score"
    gte: 0.8
select:
  use: "last"
out:
- name: "text"
  type: "Text"
  description: "Trimmed reply from the last iteration"
  maxLength: 200
  from: "$iter.trim.out.text"

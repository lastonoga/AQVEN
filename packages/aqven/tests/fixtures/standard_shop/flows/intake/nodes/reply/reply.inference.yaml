apiVersion: "aqven/v1"
kind: "Inference"
description: "Short reply to a note in the given tone"
in:
- name: "text"
  type: "Text"
  description: "Note"
  maxLength: 200
- name: "mood"
  type: "Mood"
  description: "Reply tone"
out:
- name: "text"
  type: "Text"
  description: "Reply"
  maxLength: 200
- name: "mood"
  type: "Mood"
  description: "Tone the reply came out in"
- name: "score"
  type: "Score"
  description: "Confidence in the reply"
variants:
  tone:
    on: "mood"
    cases:
      calm: "calm"
      warm: "warm"
checks:
- run: "reply_is_short"
  on_fail: "flag"

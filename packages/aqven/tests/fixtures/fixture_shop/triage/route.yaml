apiVersion: "aqven/v1"
kind: "Node"
node: "switch"
description: "Billing goes straight through, an operator confirms delivery"
on: "$classify.out.category"
cases:
  billing:
    bind:
    - name: "category"
      from: "$classify.out.category"
  delivery:
    node: "confirm"
out:
- name: "category"
  type: "TriageCategory"
  description: "Final queue"

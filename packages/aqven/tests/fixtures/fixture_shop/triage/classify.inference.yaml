apiVersion: "aqven/v1"
kind: "Inference"
description: "Choose a queue from the ticket subject and text"
in:
- name: "ticket"
  type: "TriageTicket"
  description: "Ticket"
out:
- name: "rationale"
  type: "Text"
  description: "Rationale for the choice"
  maxLength: 300
- name: "category"
  type: "TriageCategory"
  description: "Queue"
examples:
- name: "late_parcel"
  in:
    ticket:
      subject: "Where is my parcel"
      body: "The order did not arrive on time"
      customer:
        name: "Anna"
        email: null
      photo: null
  out:
    rationale: "The customer asks about delivery times"
    category: "delivery"
checks:
- use: "not_empty"
  with:
    field: "$out.rationale"
  on_fail: "retry"
- run: "fixture_shop.triage.classify:rationale_is_short"
  on_fail: "flag"

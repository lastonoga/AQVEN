apiVersion: "aqven/v1"
kind: "Node"
node: "code"
description: "Ticket summary from the subject and queue"
run: "fixture_shop.triage.code:summarize"
in:
- name: "ticket"
  type: "TriageTicket"
  description: "Ticket"
  from: "$input"
- name: "category"
  type: "TriageCategory"
  description: "Queue"
  from: "$route.out.category"
out:
- name: "summary"
  type: "Text"
  description: "Summary"
  maxLength: 200

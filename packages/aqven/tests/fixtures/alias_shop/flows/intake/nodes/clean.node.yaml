apiVersion: "aqven/v1"
kind: "Node"
node: "code"
description: "Collapse whitespace in the note"
run: "clean"
in:
- name: "text"
  type: "Text"
  description: "Note text"
  maxLength: 200
  from: "$input.text"
out:
- name: "text"
  type: "Text"
  description: "Text without extra whitespace"
  maxLength: 200

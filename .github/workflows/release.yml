name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish-to-testpypi:
        description: upload the built distributions to TestPyPI
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Wheels with Studio inside
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: both distributions agree on one version
        run: python tools/set_version.py --check

      - name: the version is the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/set_version.py --check "${GITHUB_REF_NAME#v}"

      - run: pnpm install --frozen-lockfile
      - name: build Studio
        run: pnpm --filter @aqven/studio build
      - name: copy Studio into the aqven package
        run: python tools/bundle_studio.py
      - name: the package carries the current Studio
        run: python tools/bundle_studio.py --check

      - name: build both distributions
        run: |
          uv build --package aqven-llm --out-dir dist
          uv build --package aqven --out-dir dist

      - name: every aqven distribution really ships Studio
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          INDEX = "aqven/server/static/index.html"
          wheel = glob.glob("dist/aqven-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if INDEX not in names:
              sys.exit(f"{wheel} ships no Studio")
          print(f"{wheel}: {sum(n.startswith('aqven/server/static/') and not n.endswith('/') for n in names)} Studio files")

          sdist = glob.glob("dist/aqven-*.tar.gz")[0]
          entries = tarfile.open(sdist).getnames()
          if not any(name.endswith("src/" + INDEX) for name in entries):
              sys.exit(f"{sdist} ships no Studio: installing from source would serve nothing")
          print(f"{sdist}: Studio present")
          PY

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish-to-testpypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/aqven/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist

      - name: publish aqven-llm
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/aqven_llm-*

      - name: publish aqven
        run: >
          uv publish --trusted-publishing always
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          dist/aqven-*

  publish:
    name: Publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/aqven/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist

      - name: publish aqven-llm
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/aqven_llm-*

      - name: publish aqven
        run: >
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple/
          dist/aqven-*

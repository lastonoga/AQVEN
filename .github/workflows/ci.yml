name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: ruff
        run: uv run --frozen ruff check .
      - name: uv.lock consumers
        run: uv run --frozen python tools/check_uv_lock.py
      - name: pytest aqven
        run: uv run --frozen pytest packages/aqven -q
      - name: pytest aqven-llm
        run: uv run --frozen pytest packages/aqven-llm -q
      - name: pytest tools
        run: uv run --frozen pytest tools -q
      - name: pytest examples
        run: uv run --frozen pytest examples -q
      - name: aqven check
        run: uv run --frozen aqven check examples/lumen

  types:
    name: pyright (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run --frozen pyright

  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm --filter @aqven/studio lint
      - name: tsc
        run: pnpm --filter @aqven/studio typecheck
      - name: vitest
        run: pnpm --filter @aqven/studio test
      - name: openapi types are current
        run: pnpm --filter @aqven/studio check:api

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqven/site build

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: ruff
        run: uv run --frozen ruff check .
      - name: uv.lock consumers
        run: uv run --frozen python tools/check_uv_lock.py
      - name: every distribution carries the same LICENSE
        run: |
          cmp LICENSE packages/aqven/LICENSE
          cmp LICENSE packages/aqven-llm/LICENSE
      - name: both distributions agree on one version
        run: python tools/set_version.py --check
      - name: pytest aqven
        run: uv run --frozen pytest packages/aqven -q
      - name: pytest aqven-llm
        run: uv run --frozen pytest packages/aqven-llm -q
      - name: pytest tools
        run: uv run --frozen pytest tools -q
      - name: pytest examples
        run: uv run --frozen pytest examples -q
      - name: aqven check
        run: uv run --frozen aqven check examples/lumen
      - name: agent skills
        run: uv run --frozen python tools/check_skills.py
      - name: skill references are current
        run: uv run --frozen python tools/bundle_skill_docs.py --check
      - name: skill snippets project
        run: uv run --frozen aqven check packages/aqven/tests/fixtures/skill_snippets
      - name: agent plugin passes plugin validate --strict
        run: |
          claude_cli="$(uv run --frozen python -c "import claude_agent_sdk, pathlib; print(pathlib.Path(claude_agent_sdk.__file__).parent / '_bundled' / 'claude')")"
          "$claude_cli" --version
          "$claude_cli" plugin validate --strict packages/aqven/src/aqven/agent_plugin

  types:
    name: pyright (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run --frozen aqven generate examples/lumen
      - run: uv run --frozen pyright

  studio:
    name: Studio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: eslint
        run: pnpm --filter @aqven/studio lint
      - name: tsc
        run: pnpm --filter @aqven/studio typecheck
      - name: vitest
        run: pnpm --filter @aqven/studio test
      - name: openapi types are current
        run: pnpm --filter @aqven/studio check:api

  package:
    name: Wheels with Studio inside
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build Studio
        run: pnpm --filter @aqven/studio build
      - name: copy Studio into the aqven package
        run: python tools/bundle_studio.py
      - name: the package carries the current Studio
        run: python tools/bundle_studio.py --check
      - name: build wheels
        run: |
          uv build --package aqven-llm --out-dir dist
          uv build --package aqven --out-dir dist
      - name: the wheel really contains the Studio
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/aqven-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if "aqven/server/static/index.html" not in names:
              sys.exit(f"{wheel} ships no Studio: aqven/server/static/index.html is missing")
          assets = [name for name in names if name.startswith("aqven/server/static/") and not name.endswith("/")]
          print(f"{wheel}: {len(assets)} Studio files")
          PY
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels
          path: dist/*

  site:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aqven/site build

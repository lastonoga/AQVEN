name: Bug report
description: Something in the engine, Studio, the CLI or the MCP server does not work as documented
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: AQVEN version
      description: "`uv run aqven --version`"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: macOS 15, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The command, the flow or step file, or the Studio action. The smallest project that shows it is the best.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the error code and message, or the output of `aqven check`. Remove API keys.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

      category: "light_strip"
      lamp_kind: "smart_wifi"
    resolution:
      action: "store_credit"
      summary: "Store credit of €15.00 under warranty for the strip controller overheating"
      credit:
        amount_minor: 1500
        currency: "eur"
      policy: "3f6c2a1e-8b4d-4c7a-9e21-5d0f7b8a6c34"
    chunks:
    - chunk_id: "kb_strip0flck"
      title: "Flow strip flicker"
      text: "If a Flow strip flickers near the controller, cut the power, check that the controller plug is pushed in until it clicks, and restart the strip from the Lumen app. If the flicker comes back, the controller is replaced under warranty."
    - chunk_id: "kb_ctrlheat01"
      title: "Controller heat"
      text: "A Flow strip controller runs warm, but not hot. If the controller body is hot to the touch, unplug the strip at once and do not switch it on until it has been checked: that is a sign of a faulty power supply."
    - chunk_id: "kb_credit2026"
      title: "Store credit under warranty"
      text: "Lumen Plus customers receive store credit for a faulty product within the warranty period. The credit reaches the account within 24 hours and is valid for 12 months."
    previous: null
    critique: null
  metadata:
    split: "train"

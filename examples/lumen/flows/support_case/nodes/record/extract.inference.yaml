apiVersion: "aqven/v1"
kind: "Inference"
description: "The case form filled from the data: values come from the text, the summary and the attachments, and review remarks get fixed"
in:
- name: "message"
  type: "Text"
  description: "Customer case text after whitespace normalization"
  maxLength: 4000
- name: "summary"
  type: "Text"
  description: "Case summary after parsing"
  maxLength: 600
- name: "form_fields"
  type: "FieldSpec[]"
  description: "Form fields for the case intent"
  maxItems: 30
- name: "feedback"
  type: "Issue[]?"
  description: "Review remarks from the previous attempt; null means this is the first attempt"
  maxItems: 10
- name: "photo"
  type: "Image?"
  description: "Photo of the product or the defect; null when no photo was attached"
- name: "invoice"
  type: "Document?"
  description: "Invoice or purchase receipt; null when no document was attached"
out:
- name: "record"
  type: "Dynamic"
  description: "The case form filled in against the form from the input"
  schema_from: "$in.form_fields"
  value_type: "CaseRecord"
  limits:
    max_fields: 30
    max_depth: 2
    max_text_length: 400
    max_items: 10

apiVersion: "aqven/v1"
kind: "Inference"
description: "An instruction image for the customer reply in the style of the product category; the customer's photo, when there is one, goes to the model as an attachment"
in:
- name: "text"
  type: "Text"
  description: "The customer reply whose steps the image shows"
  maxLength: 1500
- name: "category"
  type: "ProductCategory"
  description: "Product category that sets the scene of the image"
- name: "photo"
  type: "Image?"
  description: "The customer's product photo; null when no photo was attached"
out:
- name: "image"
  type: "Image"
  description: "Instruction image"
display:
  input:
    template: "illustrate.input.display.liquid"
  output:
    template: "illustrate.output.display.liquid"
prompt: "illustrate_prompt"

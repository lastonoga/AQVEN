apiVersion: "aqven/v1"
kind: "Node"
node: "llm"
description: "Черновик ответа покупателю с цитатами базы знаний моделью семейства Google"
inference: "revise"
agent: "gemini"
in:
- name: "summary"
  from: "$triage.out.summary"
- name: "customer"
  from: "$input.customer"
- name: "locale"
  from: "$input.customer.locale"
- name: "channel"
  from: "$prepare.out.channel"
- name: "product"
  from: "$input.product"
- name: "resolution"
  from: "$route.out.resolution"
- name: "chunks"
  from: "$search_kb.out.chunks"

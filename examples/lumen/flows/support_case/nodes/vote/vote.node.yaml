apiVersion: "aqven/v1"
kind: "Node"
node: "map"
description: "Три независимых голоса дешёвой открытой модели за намерение, по одному на перспективу"
over: "$prepare.out.perspectives"
body: "ballot"
concurrency: 3
on_item_error:
  use: "skip"
out:
- name: "ballots"
  type: "IntentBallot[]"
  description: "Голоса, завершившиеся успешно"
  maxItems: 3
  from: "$ok"

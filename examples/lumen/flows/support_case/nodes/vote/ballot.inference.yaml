apiVersion: "aqven/v1"
kind: "Inference"
description: "The case intent from the summary and the observations; the perspective sets the angle of the ballot"
in:
- name: "summary"
  type: "Text"
  description: "Case summary after parsing"
  maxLength: 600
- name: "observations"
  type: "Observation[]"
  description: "Observations against the category signals"
  maxItems: 12
- name: "safety_risk"
  type: "Bool"
  description: "Whether the case shows signs of a safety hazard"
- name: "perspective"
  type: "VotePerspective?"
  description: "The angle of the ballot; null means a decision with no perspective set"
out:
- name: "rationale"
  type: "Text"
  description: "Reasoning for the intent, written before the choice"
  maxLength: 300
- name: "intent"
  type: "CaseIntent"
  description: "Case intent"
- name: "confidence"
  type: "Score"
  description: "Confidence in the chosen intent"
examples:
- name: "flicker_defect"
  in:
    summary: "Светодиодная лента мерцает на участке у контроллера через неделю после установки, подключение сделано по инструкции"
    observations:
    - key: "flicker"
      value: "Мерцание у контроллера, сильнее на низкой яркости"
    safety_risk: false
    perspective: null
  out:
    rationale: "Товар пришёл исправным и перестал нормально работать при обычном использовании — это дефект изделия"
    intent: "defect"
    confidence: 0.9
- name: "crushed_box"
  in:
    summary: "Настольная лампа пришла в смятой коробке с треснувшим плафоном, покупатель просит решить вопрос с доставкой"
    observations:
    - key: "package_damaged"
      value: "Коробка смята с одного угла"
    - key: "cracked_shade"
      value: "Трещина через весь плафон"
    safety_risk: false
    perspective: null
  out:
    rationale: "Упаковка и плафон повреждены при перевозке, а не в работе товара — это проблема доставки"
    intent: "delivery"
    confidence: 0.85

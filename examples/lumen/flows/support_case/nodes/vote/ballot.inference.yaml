apiVersion: "aqven/v1"
kind: "Inference"
description: "Намерение обращения по краткому содержанию и наблюдениям; перспектива задаёт угол зрения голоса"
in:
- name: "summary"
  type: "Text"
  description: "Краткое содержание обращения после разбора"
  maxLength: 600
- name: "observations"
  type: "Observation[]"
  description: "Наблюдения по сигналам категории"
  maxItems: 12
- name: "safety_risk"
  type: "Bool"
  description: "Есть ли в обращении признаки угрозы безопасности"
- name: "perspective"
  type: "VotePerspective?"
  description: "Угол зрения голоса; null — решение без заданной перспективы"
out:
- name: "rationale"
  type: "Text"
  description: "Обоснование намерения, записывается до выбора"
  maxLength: 300
- name: "intent"
  type: "CaseIntent"
  description: "Намерение обращения"
- name: "confidence"
  type: "Score"
  description: "Уверенность в выбранном намерении"
examples:
- name: "flicker_defect"
  in:
    summary: "Светодиодная лента мерцает на участке у контроллера через неделю после установки, подключение сделано по инструкции"
    observations:
    - key: "flicker"
      value: "Мерцание у контроллера, сильнее на низкой яркости"
    safety_risk: false
    perspective: null
  out:
    rationale: "Товар пришёл исправным и перестал нормально работать при обычном использовании — это дефект изделия"
    intent: "defect"
    confidence: 0.9
- name: "crushed_box"
  in:
    summary: "Настольная лампа пришла в смятой коробке с треснувшим плафоном, покупатель просит решить вопрос с доставкой"
    observations:
    - key: "package_damaged"
      value: "Коробка смята с одного угла"
    - key: "cracked_shade"
      value: "Трещина через весь плафон"
    safety_risk: false
    perspective: null
  out:
    rationale: "Упаковка и плафон повреждены при перевозке, а не в работе товара — это проблема доставки"
    intent: "delivery"
    confidence: 0.85

apiVersion: "aqven/v1"
kind: "Node"
node: "llm"
description: "A ballot for the case intent from one perspective"
agent: "llama"
in:
- name: "summary"
  from: "$triage.out.summary"
- name: "observations"
  from: "$triage.out.observations"
- name: "safety_risk"
  from: "$triage.out.safety_risk"
- name: "perspective"
  from: "$item"

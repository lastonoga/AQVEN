apiVersion: "aqven/v1"
kind: "Inference"
description: "Ответ покупателю по принятому решению и фрагментам базы знаний с цитатами; при наличии прошлой версии — правка по критике"
in:
- name: "summary"
  type: "Text"
  description: "Краткое содержание обращения после разбора"
  maxLength: 600
- name: "customer"
  type: "Customer"
  description: "Покупатель, которому адресован ответ; его персональные данные в текст ответа не попадают"
- name: "locale"
  type: "Locale"
  description: "Язык и регион ответа"
- name: "channel"
  type: "Channel"
  description: "Канал, в который уйдёт ответ"
- name: "product"
  type: "ProductRef?"
  description: "Товар обращения; вид лампы выбирает вариант советов, null — товар не указан"
- name: "resolution"
  type: "Resolution"
  description: "Принятое решение по обращению; ответ не обещает больше него"
- name: "chunks"
  type: "KbChunk[]"
  description: "Фрагменты базы знаний — единственный источник фактов и цитат"
  maxItems: 80
- name: "previous"
  type: "ReplyDraft?"
  description: "Прошлая версия ответа для правки; null — ответ пишется впервые"
- name: "critique"
  type: "Critique?"
  description: "Критика прошлой версии; null — критики нет"
out:
- name: "reply"
  type: "ReplyDraft"
  description: "Текст ответа и цитаты фрагментов, на которые он опирается"
display:
  input:
    template: "@root/flows/support_case/nodes/polish/revise.input.display.liquid"
    variables:
      locale: "$in.locale"
  output:
    template: "@root/flows/support_case/nodes/polish/revise.output.display.liquid"
    variables:
      locale: "$in.locale"
variants:
  lamp_guide:
    on: "product.lamp_kind"
    cases:
      mains: "mains"
      rechargeable: "rechargeable"
      smart_wifi: "smart_wifi"
      smart_zigbee: "smart_zigbee"
    default: "unknown"
allowed_sets:
- type: "KbChunkId"
  from: "$in.chunks[*].chunk_id"
  labels_from: "$in.chunks[*].title"
checks:
- use: "citations_in_sources"
  with:
    citations: "$out.reply.citations"
    sources: "$in.chunks"
    id: "chunk_id"
    quote: "quote"
    text: "text"
  on_fail: "retry"
- use: "max_words"
  with:
    field: "$out.reply.text"
    max: 220
  on_fail: "retry"
- use: "no_pii"
  with:
    fields:
    - "$out.reply.text"
  on_fail: "fail"
- use: "language"
  with:
    field: "$out.reply.text"
    locale: "$in.locale"
  on_fail: "flag"
- run: "@root.code.support_case:promises_match_resolution"
  on_fail: "retry"

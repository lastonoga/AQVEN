apiVersion: "aqven/v1"
kind: "Node"
node: "switch"
description: "Routes the case by the form kind: an agent decides a warranty case, delivery and question cases get a fixed decision"
on: "$to_record.out"
cases:
  defect:
    node: "resolve"
    bind:
    - name: "resolution"
      from: "$resolve.out.resolution"
  delivery:
    bind:
    - name: "resolution"
      value:
        action: "reship"
        summary: "Повторная отправка заказа за счёт магазина"
        credit: null
        policy: null
  question:
    bind:
    - name: "resolution"
      value:
        action: "advice"
        summary: "Ответ по базе знаний без компенсации"
        credit: null
        policy: null
out:
- name: "resolution"
  type: "Resolution"
  description: "Decision on the case"

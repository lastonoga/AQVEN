apiVersion: "aqven/v1"
kind: "Inference"
description: "A warranty decision on the defect within store policy, naming the policy it applied"
in:
- name: "customer"
  type: "Customer"
  description: "The customer the order belongs to"
- name: "order_id"
  type: "OrderId"
  description: "Number of the order with the faulty product"
- name: "symptom"
  type: "DefectSymptom"
  description: "Defect symptom from the case form"
- name: "purchased_on"
  type: "Date?"
  description: "Purchase date from the form; null when the customer did not give one"
- name: "safety_risk"
  type: "Bool"
  description: "Whether the defect shows signs of a safety hazard"
- name: "intake_extra"
  type: "Dynamic"
  description: "Marketplace intake fields filled in while parsing the case"
- name: "policies"
  type: "Policy[]"
  description: "Store policies found in the knowledge base for the product category"
  maxItems: 20
out:
- name: "resolution"
  type: "Resolution"
  description: "The decision taken, naming the policy"
allowed_sets:
- type: "PolicyId"
  from: "$in.policies[*].policy_id"
  labels_from: "$in.policies[*].title"

apiVersion: "aqven/v1"
kind: "Flow"
description: "A Lumen customer case: attachment parsing, intent by ballot with a cascade, a form with repair, the decision, a knowledge-base reply with a judge panel and polishing, reply media and human approvals"
input: "CaseRequest"
output: "CaseOutcome"
returns:
- name: "case_ref"
  from: "$finalize.out.case_ref"
- name: "status"
  from: "$finalize.out.status"
- name: "intent"
  from: "$finalize.out.intent"
- name: "tier"
  from: "$finalize.out.tier"
- name: "record"
  from: "$finalize.out.record"
- name: "resolution"
  from: "$finalize.out.resolution"
- name: "reply"
  from: "$finalize.out.reply"
- name: "media"
  from: "$finalize.out.media"
- name: "closed_at"
  from: "$finalize.out.closed_at"
context:
- "date"
- "tenant_id"
order:
- "prepare"
- "triage"
- "vote"
- "tally"
- "intent"
- "case_form"
- "record"
- "to_record"
- "search_kb"
- "route"
- "drafts"
- "panel"
- "polish"
- "illustrate"
- "voice"
- "clip"
- "approvals"
- "finalize"

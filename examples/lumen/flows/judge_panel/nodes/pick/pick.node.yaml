apiVersion: "aqven/v1"
kind: "Node"
node: "code"
description: "Выбирает черновик-победитель по вердикту и собирает итог панели"
run: "pick"
in:
- name: "candidates"
  type: "ReplyDraft[]"
  description: "Черновики ответа"
  maxItems: 3
  from: "$input.candidates"
- name: "verdict"
  type: "JudgeVerdict"
  description: "Итоговый вердикт панели"
  from: "$decide.out.verdict"
- name: "tie_broken"
  type: "Bool"
  description: "Вердикт вынес судья тай-брейка"
  from: "$decide.out.tie_broken"
- name: "spread"
  type: "Float"
  description: "Наибольший разброс оценок судей по одному критерию"
  minimum: 0
  maximum: 4
  from: "$aggregate.out.spread"
out:
- name: "winner"
  type: "ReplyDraft"
  description: "Черновик-победитель"
- name: "verdict"
  type: "PanelVerdict"
  description: "Вердикт панели с признаком тай-брейка и разбросом оценок"

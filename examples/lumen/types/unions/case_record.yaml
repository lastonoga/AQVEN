apiVersion: "aqven/v1"
kind: "Type"
type: "union"
description: "The case form, by intent"
discriminator: "kind"
variants:
- name: "defect"
  description: "A warranty case about a product defect"
  fields:
  - name: "order_id"
    type: "OrderId"
    description: "Number of the order with the faulty product"
  - name: "symptom"
    type: "DefectSymptom"
    description: "Main symptom of the defect"
  - name: "purchased_on"
    type: "Date?"
    description: "Purchase date; null when it is unknown"
  - name: "safety_risk"
    type: "Bool"
    description: "There is a safety hazard: overheating, a burning smell, sparks"
- name: "delivery"
  description: "A delivery problem with the order"
  fields:
  - name: "order_id"
    type: "OrderId"
    description: "Number of the delivered order"
  - name: "damage"
    type: "DeliveryDamage"
    description: "What happened in delivery"
  - name: "carrier_ref"
    type: "Text?"
    description: "Carrier tracking number; null when it is unknown"
    maxLength: 40
- name: "question"
  description: "A customer question with no claim"
  fields:
  - name: "topic"
    type: "Text"
    description: "Subject of the question"
    maxLength: 200
  - name: "order_id"
    type: "OrderId?"
    description: "Order number when the question is about one; null otherwise"

apiVersion: "aqven/v1"
kind: "Type"
type: "union"
description: "Анкета обращения по намерению"
discriminator: "kind"
variants:
- name: "defect"
  description: "Гарантийный случай по дефекту товара"
  fields:
  - name: "order_id"
    type: "OrderId"
    description: "Номер заказа с дефектным товаром"
  - name: "symptom"
    type: "DefectSymptom"
    description: "Основной симптом дефекта"
  - name: "purchased_on"
    type: "Date?"
    description: "Дата покупки; null, если неизвестна"
  - name: "safety_risk"
    type: "Bool"
    description: "Есть угроза безопасности: перегрев, запах гари, искры"
- name: "delivery"
  description: "Проблема доставки заказа"
  fields:
  - name: "order_id"
    type: "OrderId"
    description: "Номер доставленного заказа"
  - name: "damage"
    type: "DeliveryDamage"
    description: "Что случилось при доставке"
  - name: "carrier_ref"
    type: "Text?"
    description: "Номер отправления у перевозчика; null, если неизвестен"
    maxLength: 40
- name: "question"
  description: "Вопрос покупателя без претензии"
  fields:
  - name: "topic"
    type: "Text"
    description: "Тема вопроса"
    maxLength: 200
  - name: "order_id"
    type: "OrderId?"
    description: "Номер заказа, если вопрос о нём; иначе null"

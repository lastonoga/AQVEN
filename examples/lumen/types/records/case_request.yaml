apiVersion: "aqven/v1"
kind: "Type"
type: "record"
description: "A customer case to Lumen support, with attachments"
fields:
- name: "customer"
  type: "Customer"
  description: "The customer who wrote to support"
- name: "origin"
  type: "CaseOrigin"
  description: "Channel the case arrived through"
- name: "message"
  type: "Text"
  description: "Text of the customer case"
  maxLength: 4000
- name: "order_id"
  type: "OrderId?"
  description: "Lumen order number; null when the customer did not give one"
- name: "product"
  type: "ProductRef?"
  description: "The product of the case; null when no product was identified"
- name: "tags"
  type: "Text[]"
  description: "Case tags from the store form or the marketplace"
  maxLength: 40
  maxItems: 5
- name: "urgent"
  type: "Bool"
  description: "The customer marked the case as urgent"
- name: "photo"
  type: "Image?"
  description: "Photo of the defect or the packaging; null when none was attached"
- name: "voice_note"
  type: "Audio?"
  description: "The customer's voice message; null when none was attached"
- name: "video"
  type: "Video?"
  description: "Video of the defect; null when none was attached"
- name: "invoice"
  type: "Document?"
  description: "Invoice or purchase receipt; null when none was attached"

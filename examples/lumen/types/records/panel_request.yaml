apiVersion: "aqven/v1"
kind: "Type"
type: "record"
description: "Input to the judge panel: the case, the reply candidates and the knowledge base chunks"
fields:
- name: "summary"
  type: "Text"
  description: "Case summary"
  maxLength: 600
- name: "candidates"
  type: "ReplyDraft[]"
  description: "Reply drafts for blind comparison"
  maxItems: 3
- name: "chunks"
  type: "KbChunk[]"
  description: "Knowledge base chunks the drafts rely on"
  maxItems: 80

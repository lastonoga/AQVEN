apiVersion: "aqven/v1"
kind: "Tool"
description: "Issues store credit to the customer against an order"
run: "@root.tools.functions:issue_store_credit"
effect: "write"
idempotency_key:
- "customer_id"
- "order_id"
secrets:
- name: "orders_token"
  ref: "ref:env/LUMEN_ORDERS_TOKEN"
in:
- name: "customer_id"
  type: "CustomerId"
  description: "The customer the credit is issued to"
- name: "order_id"
  type: "OrderId"
  description: "The order the credit is issued against"
- name: "amount"
  type: "Money"
  description: "Credit amount"
out:
- name: "credit_id"
  type: "Text"
  description: "Identifier of the issued credit"
  maxLength: 15
  pattern: "^cr_[a-z0-9]{12}$"
- name: "amount"
  type: "Money"
  description: "Amount issued"

apiVersion: "aqven/v1"
kind: "Tool"
description: "Голосовая версия ответа через синтез речи OpenAI"
run: "@root.tools.functions:synthesize_voice"
effect: "external"
idempotency_key:
- "text"
- "locale"
secrets:
- name: "openai_api_key"
  ref: "ref:env/OPENAI_API_KEY"
in:
- name: "text"
  type: "Text"
  description: "Текст ответа для озвучки"
  maxLength: 1500
- name: "locale"
  type: "Locale"
  description: "Язык и акцент озвучки"
out:
- name: "voice"
  type: "Audio"
  description: "Озвученный ответ в WAV"

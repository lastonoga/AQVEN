- name: "panel_nova_runtime_close"
  inputs:
    summary: "The Nova Cordless table lamp, bought in spring, lasts about six hours at full brightness before it switches off; the customer uses it on the terrace in the evenings and asks whether the battery is faulty."
    candidates:
    - text: "Six hours is quite normal for a cordless lamp. Charging it overnight with the cable from the box keeps the battery in good shape."
      citations:
      - chunk_id: "kb_novachrg02"
        quote: "Charge a Nova lamp with the USB-C cable from the box and a 5 V adapter."
    - text: "It sounds like the battery has worn out early. We can replace the battery under warranty if you send the lamp in."
      citations: []
    - text: "What you see is expected: at full brightness a fully charged Nova lamp lights for about 6 hours, and at 30% brightness it lasts up to 40 hours. Lowering the brightness on the terrace will give you much longer evenings."
      citations:
      - chunk_id: "kb_novabatt01"
        quote: "A fully charged Nova lamp lights for up to 40 hours at 30% brightness and about 6 hours at full brightness."
    chunks:
    - chunk_id: "kb_novabatt01"
      title: "Nova battery life"
      text: "A fully charged Nova lamp lights for up to 40 hours at 30% brightness and about 6 hours at full brightness. Battery capacity falls to about 80% after 500 charge cycles; that is normal wear, not a defect."
    - chunk_id: "kb_novachrg02"
      title: "Charging a Nova lamp"
      text: "Charge a Nova lamp with the USB-C cable from the box and a 5 V adapter. The ring glows amber while charging and green when full. If the ring does not light at all with a known-good cable and adapter, the charging board is faulty and the lamp is replaced under warranty."
  tags:
    contest: "close"
    category: "desk_lamp"
    winner_position: "last"
  expected_output:
    winner:
      text: "What you see is expected: at full brightness a fully charged Nova lamp lights for about 6 hours, and at 30% brightness it lasts up to 40 hours. Lowering the brightness on the terrace will give you much longer evenings."
      citations:
      - chunk_id: "kb_novabatt01"
        quote: "A fully charged Nova lamp lights for up to 40 hours at 30% brightness and about 6 hours at full brightness."
- name: "panel_zigbee_pairing_clear"
  inputs:
    summary: "The customer's new Glow E14 Candle Zigbee bulbs do not appear in the app; they tried adding them over Wi-Fi like their other Glow bulbs."
    candidates:
    - text: "Glow bulbs work only on a 2.4 GHz network, so check that your router has a 2.4 GHz band switched on and try again."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "Glow bulbs work only on a 2.4 GHz network."
    - text: "The Glow E14 Candle is a Zigbee bulb, so it pairs through the Lumen Hub rather than over Wi-Fi. Put the hub into pairing mode from the app and switch the bulb on within 60 seconds. If it still does not appear, reset it by switching it off and on six times, two seconds apart."
      citations:
      - chunk_id: "kb_zigpair001"
        quote: "Zigbee lamps pair through the Lumen Hub, not over Wi-Fi."
      - chunk_id: "kb_zigpair001"
        quote: "Put the hub into pairing mode from the app, then switch the lamp on within 60 seconds."
      - chunk_id: "kb_zigreset01"
        quote: "To reset a Zigbee lamp, switch it off and on six times, two seconds apart."
    - text: "Remove the bulbs from the device list and pair them once more, the same way as your other Glow bulbs."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "remove it from the device list and pair it once more."
    chunks:
    - chunk_id: "kb_zigpair001"
      title: "Pairing a Zigbee lamp with the Lumen Hub"
      text: "Zigbee lamps pair through the Lumen Hub, not over Wi-Fi. Put the hub into pairing mode from the app, then switch the lamp on within 60 seconds. Keep the lamp within 10 m of the hub or of a mains-powered Zigbee device that repeats the signal."
    - chunk_id: "kb_zigreset01"
      title: "Resetting a Zigbee lamp"
      text: "To reset a Zigbee lamp, switch it off and on six times, two seconds apart. The lamp flashes twice and can be paired with the hub again."
    - chunk_id: "kb_bulbwifi24"
      title: "Connecting a Glow bulb to Wi-Fi"
      text: "Glow bulbs work only on a 2.4 GHz network. After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
  tags:
    contest: "clear"
    category: "smart_bulb"
    winner_position: "middle"
  expected_output:
    winner:
      text: "The Glow E14 Candle is a Zigbee bulb, so it pairs through the Lumen Hub rather than over Wi-Fi. Put the hub into pairing mode from the app and switch the bulb on within 60 seconds. If it still does not appear, reset it by switching it off and on six times, two seconds apart."
      citations:
      - chunk_id: "kb_zigpair001"
        quote: "Zigbee lamps pair through the Lumen Hub, not over Wi-Fi."
      - chunk_id: "kb_zigpair001"
        quote: "Put the hub into pairing mode from the app, then switch the lamp on within 60 seconds."
      - chunk_id: "kb_zigreset01"
        quote: "To reset a Zigbee lamp, switch it off and on six times, two seconds apart."

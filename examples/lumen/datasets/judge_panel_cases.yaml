- name: "panel_strip_heat_clear"
  inputs:
    summary: "The Lumen Flow Strip 5 m has flickered near the controller for three days, and the controller turns hot to the touch after half an hour; the customer is afraid to leave it on and asks for a warranty fix."
    candidates:
    - text: "Sorry about the flicker. Try restarting the strip from the Lumen app, that usually sorts it out. We have also added store credit to your account."
      citations:
      - chunk_id: "kb_strip0flck"
        quote: "restart the strip from the Lumen app"
    - text: "Thank you for the details. Please unplug the strip now and keep it off: a controller that is hot to the touch is a sign of a faulty power supply. Your store credit reaches your account within 24 hours and is valid for 12 months."
      citations:
      - chunk_id: "kb_ctrlheat01"
        quote: "If the controller body is hot to the touch, unplug the strip at once and do not switch it on until it has been checked"
      - chunk_id: "kb_credit2026"
        quote: "The credit reaches the account within 24 hours and is valid for 12 months."
    - text: "Flow controllers are rated for high temperatures, so some heat is normal. Keep using the strip and the flicker should settle within a week as the controller beds in."
      citations: []
    chunks:
    - chunk_id: "kb_strip0flck"
      title: "Flow strip flicker"
      text: "If a Flow strip flickers near the controller, cut the power, check that the controller plug is pushed in until it clicks, and restart the strip from the Lumen app. If the flicker comes back, the controller is replaced under warranty."
    - chunk_id: "kb_ctrlheat01"
      title: "Controller heat"
      text: "A Flow strip controller runs warm, but not hot. If the controller body is hot to the touch, unplug the strip at once and do not switch it on until it has been checked: that is a sign of a faulty power supply."
    - chunk_id: "kb_credit2026"
      title: "Store credit under warranty"
      text: "Lumen Plus customers receive store credit for a faulty product within the warranty period. The credit reaches the account within 24 hours and is valid for 12 months."
  tags:
    contest: "clear"
    category: "light_strip"
    winner_position: "middle"
  expected_output:
    winner:
      text: "Thank you for the details. Please unplug the strip now and keep it off: a controller that is hot to the touch is a sign of a faulty power supply. Your store credit reaches your account within 24 hours and is valid for 12 months."
      citations:
      - chunk_id: "kb_ctrlheat01"
        quote: "If the controller body is hot to the touch, unplug the strip at once and do not switch it on until it has been checked"
      - chunk_id: "kb_credit2026"
        quote: "The credit reaches the account within 24 hours and is valid for 12 months."
- name: "panel_bulb_router_close"
  inputs:
    summary: "After the router was replaced, the Lumen Glow E27 smart bulb disappeared from the app and shows “offline”, although it still lights up. The customer asks how to get it back into the app."
    candidates:
    - text: "After a router change the bulb has to be added to the app again. Remove it from the device list and pair it once more."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
    - text: "To reset the bulb, switch it on and off five times in a row, one second apart; it blinks three times when it is ready to pair."
      citations:
      - chunk_id: "kb_bulbreset5"
        quote: "To reset a Glow bulb, switch it on and off five times in a row, one second apart."
    - text: "After a router change the bulb has to be added to the app again: remove it from the device list, then pair it once more on the 2.4 GHz network, since Glow bulbs do not work on 5 GHz. To put it into pairing mode, switch it on and off five times, one second apart, until it blinks three times."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "Glow bulbs work only on a 2.4 GHz network."
      - chunk_id: "kb_bulbwifi24"
        quote: "After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
      - chunk_id: "kb_bulbreset5"
        quote: "To reset a Glow bulb, switch it on and off five times in a row, one second apart."
    chunks:
    - chunk_id: "kb_bulbwifi24"
      title: "Connecting a Glow bulb to Wi-Fi"
      text: "Glow bulbs work only on a 2.4 GHz network. After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
    - chunk_id: "kb_bulbreset5"
      title: "Resetting a Glow bulb"
      text: "To reset a Glow bulb, switch it on and off five times in a row, one second apart. The bulb blinks three times and goes into pairing mode."
  tags:
    contest: "close"
    category: "smart_bulb"
    winner_position: "last"
  expected_output:
    winner:
      text: "After a router change the bulb has to be added to the app again: remove it from the device list, then pair it once more on the 2.4 GHz network, since Glow bulbs do not work on 5 GHz. To put it into pairing mode, switch it on and off five times, one second apart, until it blinks three times."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "Glow bulbs work only on a 2.4 GHz network."
      - chunk_id: "kb_bulbwifi24"
        quote: "After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
      - chunk_id: "kb_bulbreset5"
        quote: "To reset a Glow bulb, switch it on and off five times in a row, one second apart."

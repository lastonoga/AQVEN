apiVersion: "aqven/v1"
kind: "Project"
description: "Lumen: customer support for a smart lighting brand — a case workflow and the judge panel workflow it calls, covering every node kind and execution mode"
package: "lumen"
providers:
- id: "openrouter"
  api_key: "ref:env/OPENROUTER_API_KEY"
  data_policy:
    allows_pii: true
    allows_sensitive: false
    retention: "unknown"
  routing:
    data_collection: "deny"
    zdr: false
  limits:
    rpm: 60
policies:
  pii:
    mask_in_traces: true
    redact:
    - "email"
    - "phone"
    - "card_number"
    - "iban"
  trust:
    default_in: "untrusted"
renames:
- kind: "node"
  from: "support_case.drafts__claude"
  to: "support_case.drafts__mistral"
  at: "2026-09-17T16:48:45Z"

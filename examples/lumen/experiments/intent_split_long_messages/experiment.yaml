apiVersion: "aqven/v1"
kind: "Experiment"
description: "Condensing a long customer message before deciding the intent beats deciding it from the whole message, at most 50% dearer per correct intent"
failure_mode: "intent_misread"
subject:
  arm: "one_step"
cases:
  dataset: "long_customer_messages"
variants:
- id: "one_step"
  arm: "one_step"
- id: "two_step"
  arm: "two_step"
checks:
- id: "intent"
  kind: "binary"
  use: "expected"
  with:
    fields:
    - "intent"
question:
  kind: "compare"
  baseline: "one_step"
  candidate: "two_step"
  primary: "intent"
  margin: 0.05
  guardrails:
  - metric: "cost_of_pass"
    direction: "lower_is_better"
    margin: 0.5
    relative: true
plan:
  cases: 12
  repeats: 3

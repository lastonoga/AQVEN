apiVersion: "aqven/v1"
kind: "Node"
node: "llm"
description: "The DeepSeek-family critic scores the reply against the decision and the knowledge base chunks"
inference: "critique"
agent: "deepseek"
in:
- name: "summary"
  from: "$input.summary"
- name: "resolution"
  from: "$input.resolution"
- name: "chunks"
  from: "$input.chunks"
- name: "reply"
  from: "$input.reply"

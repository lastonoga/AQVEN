[project]
name = "lumen"
version = "0.0.0"
description = "Lumen: воркфлоу поддержки покупателей и медиастудии бренда умного освещения на aqven"
requires-python = ">=3.14,<3.15"
dependencies = ["aqven"]

[project.scripts]
lumen = "lumen.__main__:serve"

[tool.uv.sources]
aqven = { workspace = true }

[build-system]
requires = ["uv_build==0.12.15"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "lumen"
source-exclude = [".aqven", ".env", ".env.example"]
wheel-exclude = [".aqven", ".env", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
aqven_project = "lumen"

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"lumen/types.py" = ["E501"]

[tool.ruff.format]
exclude = ["lumen/types.py"]

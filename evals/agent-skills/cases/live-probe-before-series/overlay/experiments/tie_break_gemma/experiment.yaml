apiVersion: "aqven/v1"
kind: "Experiment"
description: "A Gemma tie-break picks the expected winner at least as often as the gpt tie-break, at most 30% dearer per correct pick"
failure_mode: "panel_wrong_winner"
subject:
  flow: "judge_panel"
varies:
  what: "agent"
  nodes:
  - "tie_break"
cases:
  dataset: "judge_panel_cases"
variants:
- id: "gpt_tie_break"
- id: "gemma_tie_break"
  nodes:
    tie_break: "gemma"
checks:
- id: "winner"
  kind: "binary"
  use: "expected"
  with:
    fields:
    - "winner"
question:
  kind: "compare"
  baseline: "gpt_tie_break"
  candidate: "gemma_tie_break"
  primary: "winner"
  margin: 0.05
  guardrails:
  - metric: "cost_of_pass"
    direction: "lower_is_better"
    margin: 0.3
    relative: true
plan:
  cases: 8
  repeats: 3

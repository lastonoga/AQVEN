- name: "crushed_lamp_clean"
  inputs:
    summary: "The Lumen Arc Floor lamp arrived through Ozon in a crushed box with a cracked shade; a photo of the packaging is attached. The customer asks for the delivery damage to be sorted out."
    resolution:
      action: "reship"
      summary: "The order is shipped again at the store's expense"
      credit: null
      policy: null
    chunks:
    - chunk_id: "kb_shipdmg001"
      title: "Damage in delivery"
      text: "If a product arrives damaged, keep the packaging and photograph it. Lumen ships the order again at its own expense, and a courier collects the damaged product."
    - chunk_id: "kb_ozonclaim1"
      title: "Ozon orders"
      text: "For Ozon orders a reshipment is arranged through Lumen support; there is no need to raise a separate claim on the marketplace."
    reply:
      text: "We are sorry the Arc Floor lamp arrived damaged. Please keep the packaging and the photo you took. We will ship the order again at our expense, and a courier will collect the damaged lamp. There is no need to raise a separate claim on Ozon: we arrange the reshipment here."
      citations:
      - chunk_id: "kb_shipdmg001"
        quote: "Lumen ships the order again at its own expense, and a courier collects the damaged product."
      - chunk_id: "kb_ozonclaim1"
        quote: "there is no need to raise a separate claim on the marketplace."
  tags:
    planted: "no"
    defect: "none"
    action: "reship"
    subtlety: "none"

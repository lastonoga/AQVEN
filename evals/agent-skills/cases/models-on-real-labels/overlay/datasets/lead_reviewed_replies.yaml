- name: "archive_zigbee_range_sent"
  inputs:
    summary: "A Glow E27 Zigbee bulb in the garden shed keeps going offline; the Lumen Hub is in the house about 15 m away. The customer asks how to keep it connected."
    resolution:
      action: "advice"
      summary: "A knowledge base answer with no compensation"
      credit: null
      policy: null
    chunks:
    - chunk_id: "kb_zigpair001"
      title: "Pairing a Zigbee lamp with the Lumen Hub"
      text: "Zigbee lamps pair through the Lumen Hub, not over Wi-Fi. Put the hub into pairing mode from the app, then switch the lamp on within 60 seconds. Keep the lamp within 10 m of the hub or of a mains-powered Zigbee device that repeats the signal."
    reply:
      text: "The shed is about 15 m from the hub, which is past the 10 m the bulb can reach on its own. Put a mains-powered Zigbee device, such as another Glow bulb or a smart plug, between the house and the shed; it repeats the signal and keeps the bulb connected."
      citations:
      - chunk_id: "kb_zigpair001"
        quote: "Keep the lamp within 10 m of the hub or of a mains-powered Zigbee device that repeats the signal."

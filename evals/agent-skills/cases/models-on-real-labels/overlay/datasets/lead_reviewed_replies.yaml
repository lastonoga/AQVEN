- name: "archive_two_questions_blocked"
  inputs:
    summary: "The Nova Cordless lamp lasts about four hours on a charge instead of the eight it did when new; the customer asks whether that is normal and whether the battery can be replaced."
    resolution:
      action: "advice"
      summary: "A knowledge base answer with no compensation"
      credit: null
      policy: null
    chunks:
    - chunk_id: "kb_novabatt01"
      title: "Nova battery life"
      text: "The Nova battery keeps about 80% of its capacity after 300 full charges; runtime falls gradually with use. This is normal wear, not a fault."
    - chunk_id: "kb_novabatt02"
      title: "Replacing the Nova battery"
      text: "The Nova battery can be replaced by a Lumen service centre for a fixed fee; the lamp is sent in with the prepaid label from the app."
    reply:
      text: "A shorter runtime after long use is normal: the Nova battery keeps about 80% of its capacity after 300 full charges, and the runtime falls gradually. This is wear, not a fault."
      citations:
      - chunk_id: "kb_novabatt01"
        quote: "This is normal wear, not a fault."

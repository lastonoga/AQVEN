cases:
- name: "archive_strip_cut_length_sent"
  inputs:
    summary: "The customer bought a Lumen Flow Strip 5 m for a 3.2 m shelf and asks whether the strip can be shortened and what happens to the leftover piece."
    resolution:
      action: "advice"
      summary: "A knowledge base answer with no compensation"
      credit: null
      policy: null
    chunks:
    - chunk_id: "kb_stripcut001"
      title: "Shortening a Flow strip"
      text: "A Flow strip can be cut only on the marked copper lines, every 10 cm. The piece after the cut is no longer powered and cannot be reconnected without the Flow connector kit."
    - chunk_id: "kb_stripkit002"
      title: "Flow connector kit"
      text: "The Flow connector kit joins two cut pieces or adds a corner. It is sold separately."
    reply:
      text: "Yes, you can shorten the strip: cut it only on one of the marked copper lines, which come every 10 cm, so for your shelf cut at 3.2 m. The leftover piece is no longer powered; to use it later you would need the Flow connector kit, which is sold separately."
      citations:
      - chunk_id: "kb_stripcut001"
        quote: "A Flow strip can be cut only on the marked copper lines, every 10 cm."
      - chunk_id: "kb_stripkit002"
        quote: "The Flow connector kit joins two cut pieces or adds a corner."
  tags:
    source: "archive"
    lead_verdict: "send"
    action: "advice"
  metadata:
    ticket: "LUM-T-240811"
    reviewed_by: "support lead"
  expected_output:
    verdict: "send"
- name: "archive_bulb_5ghz_blocked"
  inputs:
    summary: "After a new router was installed, the customer's Glow A60 bulbs dropped off the app; the customer asks how to connect them to the new network."
    resolution:
      action: "advice"
      summary: "A knowledge base answer with no compensation"
      credit: null
      policy: null
    chunks:
    - chunk_id: "kb_bulbwifi24"
      title: "Connecting a Glow bulb to Wi-Fi"
      text: "Glow bulbs work only on a 2.4 GHz network. After a router or password change the bulb has to be added to the app again: remove it from the device list and pair it once more."
    reply:
      text: "Sorry for the trouble with the new router. Connect the bulbs to the 5 GHz network of the new router for a faster connection, then remove each bulb from the device list and pair it again."
      citations:
      - chunk_id: "kb_bulbwifi24"
        quote: "remove it from the device list and pair it once more."

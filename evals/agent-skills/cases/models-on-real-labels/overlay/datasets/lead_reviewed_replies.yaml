- name: "archive_warranty_replacement_sent"
  inputs:
    summary: "The Nova Cordless lamp of a customer stopped charging after two months: the charging ring never lights with two cables and two adapters. The customer asks for a working lamp."
    resolution:
      action: "replacement"
      summary: "A replacement lamp under warranty"
      credit: null
      policy: "7a1d9c4e-2f6b-4e83-b5a0-9c3e1d7f2a58"
    chunks:
    - chunk_id: "kb_novachrg01"
      title: "Nova does not charge"
      text: "If the charging ring does not light with a working cable and adapter, the charging board is faulty. Within the warranty period Lumen sends a replacement lamp; the faulty one is returned with the prepaid label."
    reply:
      text: "Thank you for trying the other cables and adapters; that tells us the charging board is faulty. We are sending you a replacement lamp under warranty. Please return the faulty one with the prepaid label you will find in the app."
      citations:
      - chunk_id: "kb_novachrg01"
        quote: "Within the warranty period Lumen sends a replacement lamp; the faulty one is returned with the prepaid label."
